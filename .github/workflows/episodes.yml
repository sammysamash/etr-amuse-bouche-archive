name: Update episodes list

on:
  schedule:
    - cron: "7 1 * * 6"     # every Friday about 6pm Pacific (5pm in winter)
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: build-archive        # never runs at the same moment as the newsletter job
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build episodes list
        env:
          YT_CHANNEL: ${{ vars.YT_CHANNEL }}
          START_DATE: ${{ vars.EPISODES_START_DATE }}
          TITLE_STYLE: ${{ vars.TITLE_STYLE }}
        run: python episodes.py
      - name: Commit any new episodes
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Add new episodes"
          git pull --rebase
          git push
