name: Update newsletter archive

on:
  schedule:
    - cron: "17 14 * * 5"   # every Friday, about 7am Pacific (6am in winter)
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: build-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build archive
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
          DELAY_DAYS: ${{ vars.DELAY_DAYS || '14' }}
        run: python build.py
      - name: Commit any new editions
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Add newly public editions"
          git push
